<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diario de estudio: registra tus sesiones y mantén la racha.">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>

      <section class="racha">
        <p class="racha-numero" id="racha-numero">0</p>
        <p class="racha-texto" id="racha-texto">días de racha</p>
      </section>

      <div class="estadisticas">
        <section class="resumen">
          <p class="resumen-texto">Esta semana</p>
          <p class="resumen-minutos" id="total-semana-minutos">0 min esta semana</p>
        </section>
        <section class="resumen">
          <p class="resumen-texto">Días estudiados</p>
          <p class="resumen-minutos" id="total-dias-estudiados">0 días estudiados</p>
        </section>
      </div>
    </header>

    <section class="tarjeta">
      <h2>Registrar sesión</h2>
      <form id="form-sesion">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="campo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" placeholder="Ej.: Biología" required>
        </div>
        <div class="campo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" min="1" step="1" placeholder="Ej.: 45" required>
        </div>
        <button type="submit" class="boton">Añadir sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Sesiones</h2>
      <ul class="lista-sesiones" id="lista-sesiones"></ul>
    </section>

    <section class="tarjeta">
      <h2>Mapa de calor</h2>
      <div id="mapa" class="mapa" role="group" aria-label="Mapa de calor de estudio"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
